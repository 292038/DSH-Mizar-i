name: Build unsigned IPA

# 放进你 fork 里的 .github/workflows/build-ipa.yml
# 触发方式：仓库 Actions 页面 -> 左侧 "Build unsigned IPA" -> Run workflow

on:
  workflow_dispatch:

jobs:
  build:
    # 关键：iOS 26 SDK 需要 Xcode 26。macos-26 镜像自带 Xcode 26.6 + iPhoneOS 26.5 SDK。
    # 用 macos-14 / macos-15 会拿到 Xcode 16，DSH-Mizar 的 IPHONEOS_DEPLOYMENT_TARGET=26.0 直接编不过。
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Archive without code signing
        run: |
          set -o pipefail
          xcodebuild archive \
            -project DSH-Mizar.xcodeproj \
            -scheme DSH-Mizar \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/DSH-Mizar.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            2>&1 | tee "$RUNNER_TEMP/archive.log"
          echo "--- archive result ---"
          test -d "$RUNNER_TEMP/DSH-Mizar.xcarchive/Products/Applications/DSH-Mizar.app"

      - name: Package Payload into an .ipa
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DSH-Mizar.xcarchive/Products/Applications/DSH-Mizar.app"
          mkdir -p "$RUNNER_TEMP/pkg/Payload"
          cp -R "$APP" "$RUNNER_TEMP/pkg/Payload/"
          cd "$RUNNER_TEMP/pkg"
          # .ipa = 一个 zip，里面是 Payload/<App>.app
          zip -qry "$RUNNER_TEMP/DSH-Mizar-unsigned.ipa" Payload
          ls -lh "$RUNNER_TEMP/DSH-Mizar-unsigned.ipa"
          shasum -a 256 "$RUNNER_TEMP/DSH-Mizar-unsigned.ipa"
          echo "--- 预期：下面这条 codesign 检查应当报错（未签名），报错才正常 ---"
          codesign -dv "$APP" 2>&1 || true

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DSH-Mizar-unsigned-ipa
          path: ${{ runner.temp }}/DSH-Mizar-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/archive.log
          if-no-files-found: ignore
          retention-days: 7
